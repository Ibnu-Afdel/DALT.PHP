services:
  app:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - db_password
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: dalt

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
